<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard PROSPEX IF 2026</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <!-- FontAwesome Icon CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Topbar Header -->
  <header class="bg-slate-800/90 border-b border-slate-700 px-6 py-4 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg">
          <i class="fa-solid fa-trophy text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-white leading-tight">Scoreboard PROSPEX 2026</h1>
          <p class="text-[11px] text-slate-400">Klasemen Perolehan Poin Peserta & Kelompok</p>
        </div>
      </div>
      <span id="user-db-status" class="inline-flex items-center gap-2 text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live
      </span>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- Navigation Tabs Toggle -->
    <div class="flex border-b border-slate-700">
      <button onclick="switchUserTab('kelompok')" id="tab-btn-kelompok"
        class="py-3 px-6 text-xs sm:text-sm font-bold border-b-2 transition flex items-center gap-2 border-indigo-500 text-indigo-400 bg-slate-800/60">
        <i class="fa-solid fa-users"></i> 1. Klasemen Kelompok
      </button>
      <button onclick="switchUserTab('individu')" id="tab-btn-individu"
        class="py-3 px-6 text-xs sm:text-sm font-bold border-b-2 transition flex items-center gap-2 border-transparent text-slate-400 hover:text-white">
        <i class="fa-solid fa-user"></i> 2. Daftar & Skor Peserta
      </button>
    </div>

    <!-- Container Content Area -->
    <div id="user-content-area"></div>

  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    PROSPEX IF 2026 &bull; Himpunan Mahasiswa Informatika UNIBI
  </footer>

  <script src="public.js"></script>
</body>
</html>
